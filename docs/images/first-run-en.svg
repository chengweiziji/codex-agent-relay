<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="960" viewBox="0 0 1200 960" role="img" aria-labelledby="title desc"><title id="title">First-time setup</title><desc id="desc">Setup guide showing installation, model selection, and handoff preparation.</desc><rect width="1200" height="960" rx="12" fill="#ffffff"/><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif">
<text x="48" y="58" font-size="14" fill="#57606a" font-weight="600">CODEX AGENT RELAY</text>
<text x="48" y="102" font-size="30" fill="#24292f" font-weight="650">First-time setup</text>
<text x="48" y="139" font-size="17" fill="#57606a" font-weight="400">Install once, choose a receiver; every handoff attests the actual model and workspace-write sandbox.</text>
<path d="M48 165H1152" stroke="#d0d7de"/>
<rect x="48" y="196" width="32" height="32" rx="6" fill="#0969da"/>
<text x="58" y="219" font-size="18" fill="white" font-weight="600">1</text>
<text x="96" y="220" font-size="21" fill="#24292f" font-weight="600">Install the plugin</text>
<text x="96" y="257" font-size="15" fill="#57606a" font-weight="400">Download the full project and run the installer.</text>
<text x="96" y="285" font-size="15" fill="#57606a" font-weight="400">Install in Codex; review and trust its Hooks.</text>
<rect x="48" y="376" width="32" height="32" rx="6" fill="#0969da"/>
<text x="58" y="399" font-size="18" fill="white" font-weight="600">2</text>
<text x="96" y="400" font-size="21" fill="#24292f" font-weight="600">Choose a project and model</text>
<text x="96" y="437" font-size="15" fill="#57606a" font-weight="400">Open Settings and fill in the fields shown here.</text>
<text x="96" y="465" font-size="15" fill="#57606a" font-weight="400">You choose the model. Saving makes no model call.</text>
<rect x="48" y="556" width="32" height="32" rx="6" fill="#0969da"/>
<text x="58" y="579" font-size="18" fill="white" font-weight="600">3</text>
<text x="96" y="580" font-size="21" fill="#24292f" font-weight="600">Start a project chat</text>
<text x="96" y="617" font-size="15" fill="#57606a" font-weight="400">Work normally in your configured project.</text>
<text x="96" y="645" font-size="15" fill="#57606a" font-weight="400">Near the threshold Codex saves a checkpoint; the handoff attests route and sandbox.</text>
<rect x="610" y="195" width="542" height="646" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="636" y="231" font-size="17" fill="#24292f" font-weight="600">Settings / First-time setup</text>
<path d="M610 252H1152" stroke="#d0d7de"/>
<text x="636" y="282" font-size="13" fill="#57606a" font-weight="500">Project folder</text>
<rect x="636" y="292" width="490" height="38" rx="5" fill="white" stroke="#d0d7de"/>
<text x="650" y="317" font-size="15" fill="#24292f" font-weight="400">D:/work/my-project</text>
<text x="636" y="359" font-size="13" fill="#57606a" font-weight="500">Receiving Agent</text>
<rect x="636" y="369" width="490" height="38" rx="5" fill="white" stroke="#d0d7de"/>
<text x="650" y="394" font-size="15" fill="#24292f" font-weight="400">DeepSeek Harness</text>
<text x="636" y="436" font-size="13" fill="#57606a" font-weight="500">Harness installation folder</text>
<rect x="636" y="446" width="490" height="38" rx="5" fill="white" stroke="#d0d7de"/>
<text x="650" y="471" font-size="15" fill="#24292f" font-weight="400">D:/Apps/DeepSeek-Harness-App</text>
<text x="636" y="513" font-size="13" fill="#57606a" font-weight="500">Provider</text>
<rect x="636" y="523" width="490" height="38" rx="5" fill="white" stroke="#d0d7de"/>
<text x="650" y="548" font-size="15" fill="#24292f" font-weight="400">deepseek-official</text>
<text x="636" y="590" font-size="13" fill="#57606a" font-weight="500">Model — your choice</text>
<rect x="636" y="600" width="490" height="38" rx="5" fill="white" stroke="#0969da"/>
<text x="650" y="625" font-size="15" fill="#6e7781" font-weight="400">Enter an available model ID</text>
<text x="636" y="667" font-size="13" fill="#57606a" font-weight="500">Remaining quota threshold</text>
<rect x="636" y="677" width="490" height="38" rx="5" fill="white" stroke="#d0d7de"/>
<text x="650" y="702" font-size="15" fill="#24292f" font-weight="400">5%</text>
<text x="636" y="766" font-size="13" fill="#57606a" font-weight="400">Credentials: environment name or existing Harness login</text>
<rect x="636" y="785" width="230" height="36" rx="5" fill="#0969da"/>
<text x="652" y="809" font-size="15" fill="#fff" font-weight="600">Save and enable project</text>
<path d="M48 869H1152" stroke="#d0d7de"/>
<text x="48" y="902" font-size="17" fill="#24292f" font-weight="500">Change the model later: Settings → project → Agent / Provider / Model → Save.</text>
<text x="48" y="932" font-size="13" fill="#6e7781" font-weight="400">Illustration with example paths. The bundled adapter dispatches only in the workspace-write sandbox and attests provider/model; other Agents need an adapter.</text>
</g></svg>